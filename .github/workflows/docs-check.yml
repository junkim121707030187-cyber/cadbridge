name: Workspace foundation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B scripts/check_workspace.py --verify-manifest
      - run: python -B -m unittest discover -s tests -v
# FreeCAD가 없는 runner의 native 시험은 명시적으로 skip된다. 이 CI를 CAD 실행 통과로 보고하지 않는다.
# 문서·단위 시험, 실행기가 있는 경우 실제 native 시험. 외부 모델 추론·배포 없음.
